[project]
name = "accentshift-backend"
version = "0.1.0"
description = "DP6 AccentShift — accent conversion pipeline (Architecture A)"
requires-python = ">=3.10,<3.11"
dependencies = [
    "numpy>=1.24,<2.0",
    "scipy>=1.10",
    "librosa>=0.10.1",
    "soundfile>=0.12.1",
    "pyloudnorm>=0.1.1",
    "pyworld>=0.3.4",
    "silero-vad>=5.1",
    "transformers>=4.40",
    "jiwer>=3.0",
    "speechbrain>=1.0",
    "scikit-learn>=1.3",
    "joblib>=1.3",
    "pyyaml>=6.0",
    "click>=8.1",
    "huggingface-hub>=0.23",
    "tqdm>=4.66",
]

[project.optional-dependencies]
# torch installed separately via CUDA index (see SETUP.md)
dev = ["pytest>=8.0"]

[tool.uv]
# torch/torchaudio pinned + CUDA index handled in SETUP.md, not here

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline", "evaluation"]

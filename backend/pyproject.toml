[project]
name = "accentshift-backend"
version = "0.1.0"
description = "DP6 AccentShift — accent conversion pipeline (Architecture A)"
requires-python = ">=3.10,<3.11"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "librosa>=0.10.1",
    "soundfile>=0.12.1",
    "pyloudnorm>=0.1.1",
    "pyworld>=0.3.4",
    "silero-vad>=5.1",
    "transformers>=4.40",
    "jiwer>=3.0",
    "speechbrain>=1.0",
    "scikit-learn>=1.3",
    "joblib>=1.3",
    "pyyaml>=6.0",
    "click>=8.1",
    "huggingface-hub>=0.23",
    "hf-xet>=1.0",
    "truststore>=0.9",
    "tqdm>=4.66",
    # Seed-VC V2 + Vevo runtime deps (the repos' own requirements.txt pin torch/numpy
    # destructively — install these instead; torch/torchaudio come from the cu118 index).
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "einops>=0.8",
    "munch>=4.0",
    "accelerate>=0.30",
    "pydub>=0.25",
    # API layer
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "matplotlib>=3.10.9",
    # CUDA torch — index override keeps uv from swapping in CPU builds on sync
    "torch==2.6.0",
    "torchaudio==2.6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.uv]
[tool.uv.sources]
torch = { index = "pytorch-cu118" }
torchaudio = { index = "pytorch-cu118" }

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline", "evaluation", "api"]

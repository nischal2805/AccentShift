audio:
  sample_rate: 16000
  mono: true
  max_segment_s: 12.0          # fewer, longer segments -> fewer seams/voice-mixing

vad:
  threshold: 0.5
  min_speech_ms: 500
  min_silence_ms: 500

models:
  whisper: "openai/whisper-small"
  ser: "audeering/wav2vec2-large-robust-12-ft-emotion-msp-dim"
  utmos_hub: "sarulab-speech/UTMOS22"
  ecapa: "speechbrain/spkrec-ecapa-voxceleb"

seed_vc:
  enabled: false               # VEVO-ONLY TEST: skip Seed-VC
  repo_dir: "third_party/seed-vc"
  device: "cuda"
  convert_style: false         # WINNER (B_style_off): preserves source prosody/emotion natively; accent from timbre
  anonymization_only: false
  diffusion_steps: 40          # more steps = cleaner accent imprint
  length_adjust: 1.0
  intelligibility_cfg_rate: 0.7
  similarity_cfg_rate: 2.8    # boosted accent pull toward reference (B used 2.0; push without touching emotion)
  top_p: 0.9
  temperature: 1.0
  repetition_penalty: 1.3
  ar_checkpoint_path: null      # null = auto-download from HF (Plachta/Seed-VC)
                                # after finetune: set to checkpoints/seedvc_finetuned/<accent>/AR_epoch_*.pth
  cfm_checkpoint_path: "checkpoints/seedvc_finetuned/all_ft/CFM_epoch_00016_step_14000.pth"     # after finetune: set to checkpoints/seedvc_finetuned/<accent>/CFM_epoch_*.pth
  compile: false

vevo:
  repo_dir: "third_party/Amphion"
  enabled: true
  device: "cuda"
  flow_matching_steps: 40        # global default (stronger/cleaner accent)
  max_ref_s: 10.0               # trim style/timbre ref (Vevo AR ~2000 token cap)
  hf_repo: "amphion/Vevo"
  cache_dir: "checkpoints/Vevo"

devices:
  main: "cuda"
  vram_gb_threshold: 0         # below this, Vevo forced to CPU
  whisper_vram_gb_threshold: 4  # below this, Whisper+SER forced to CPU (4 = whisper-small on 8GB RTX 4060)

quality:
  catastrophic_wer_fallback: 0.0    # DISABLED: source passthrough leaked the original voice
  f0_weight:  0.7   # Pearson r between source/output voiced F0 contours — real dynamic range
  wer_weight: 0.1   # WER output vs source transcript; small weight (Whisper struggles with heavy accents)
  mos_weight: 0.2   # proxy MOS from spectral flatness + RMS dynamics

emotion_correction:
  method: energy             # WINNER: RMS intensity transfer (non-destructive). Emotion preserved by convert_style=false
                             # "world"  = legacy PYIN+WORLD resynth — robotic on neural output, experiments only
  always_correct_f0: true    # (world method only) always restore source F0
  f0_corr_threshold: 0.6    # fallback gate (unused when always=true)
  f0_scale_clip: [0.75, 1.4]
  energy_scale_clip: [0.75, 1.3]

emotion_encoder:
  mode: "chunked_ser"     # "chunked_ser" (no extra model) | "emformer" (torchaudio RNNT)
  smooth_sigma: 5         # Gaussian smoothing frames for per-frame alpha/scale curves

postprocess:
  crossfade_ms: 10
  target_lufs: -23.0

paths:
  checkpoints: "checkpoints"
  references: "references"

accents:
  - { key: "indian_english",   label: "Indian English" }
  - { key: "chinese_english",  label: "Chinese-accented English" }
  - { key: "japanese_english", label: "Japanese-accented English" }
  - { key: "british_english",  label: "British English" }
  - { key: "american_english", label: "American English" }
  - { key: "korean_english",   label: "Korean-accented English" }
  - { key: "arabic_english",   label: "Arabic-accented English" }
  - { key: "nigerian_english", label: "Nigerian English" }

# Per-accent tuning — overrides merged into cfg at runtime (run_pipeline.apply_accent_overrides)
accent_overrides:
  nigerian_english:
    emotion_correction:
      energy_scale_clip: [0.5, 1.9]    # emotion POP: wider dynamics (was flat)
  korean_english:
    vevo:
      max_ref_s: 12.0                  # longer ref = stronger accent transfer
      flow_matching_steps: 40          # cleaner accent
  chinese_english:
    vevo:
      max_ref_s: 14.0                  # longer ref = stronger accent
      flow_matching_steps: 48          # cleaner
    emotion_correction:
      energy_scale_clip: [0.5, 1.8]    # emotion pop
